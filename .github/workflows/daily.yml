name: Winterradar — dagelijkse update en publicatie

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 5,11,17,23 * * *' # Vier pogingen per dag om tijdelijke bronstoringen op te vangen

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: winterradar-pages
  cancel-in-progress: false

jobs:
  collect-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4
      - name: Python instellen
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Controleer Python en dashboardlogica
        run: |
          python -m py_compile scripts/update.py scripts/winter_v2.py scripts/data_quality.py scripts/outlook.py
          PYTHONPATH=scripts python scripts/test_data_quality.py
          PYTHONPATH=scripts python scripts/test_outlook.py
          node --check assets/winter-v2.js
          node --check assets/data-health.js
          node --check assets/historical-backtest.js
          node --check assets/kou-radar.js
          node scripts/test_kou_radar.cjs
      - name: Herstel vorige geldige brongegevens uit cache
        id: restore-weather-cache
        uses: actions/cache/restore@v4
        with:
          path: data/last_good.json
          key: winterradar-sources-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            winterradar-sources-
      - name: Herstel eerste geldige brongegevens uit eerdere geslaagde run
        if: ${{ hashFiles('data/last_good.json') == '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data /tmp/winterradar-seed
          if gh run download 43571975955 --name github-pages --dir /tmp/winterradar-seed; then
            if test -s /tmp/winterradar-seed/artifact.tar; then
              tar -xOf /tmp/winterradar-seed/artifact.tar ./data/latest.json > data/last_good.json || true
              python -c 'import json,pathlib; p=pathlib.Path("data/last_good.json"); json.loads(p.read_text()) if p.exists() and p.stat().st_size else None'
            fi
          fi
      - name: Weergegevens en NAO/AO ophalen
        run: python scripts/update.py
      - name: Bewaar geldige brongegevens voor volgende run
        uses: actions/cache/save@v4
        with:
          path: data/last_good.json
          key: winterradar-sources-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Websitebestanden samenstellen
        shell: bash
        run: |
          mkdir -p dist/data
          cp index.html dist/index.html
          cp data/latest.json dist/data/latest.json
          cp -R assets dist/assets
          # Pin the NASA/SDO archival photograph to GitHub Pages to avoid
          # cross-origin image blocking in mobile browsers. The page has a
          # remote fallback if the NASA download is temporarily unavailable.
          curl --fail --silent --show-error --location --retry 2 --connect-timeout 10 --max-time 35 "https://svs.gsfc.nasa.gov/vis/a000000/a003900/a003983/SDOAIA304A_Jewelbox.01000.jpg" -o dist/assets/sun-nasa-304.jpg || echo "NASA solar photograph unavailable: remote fallback remains active"
          touch dist/.nojekyll
      - name: GitHub Pages configureren
        uses: actions/configure-pages@v5
      - name: Website-artifact uploaden
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Wacht tot GitHub de websitebestanden heeft geregistreerd
        run: sleep 10
      - name: Website publiceren
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Datakwaliteit controleren
        shell: bash
        run: |
          python - <<'PY'
          import json,sys
          data=json.load(open('data/latest.json'))
          quality=data.get('data_quality',{})
          print('DATA QUALITY:',quality)
          if quality.get('state')!='complete':
              print('::warning::Niet alle modelbronnen zijn actueel; controleer de bronstatus in het dashboard.')
          source=(data.get('source_status') or {})
          if source.get('forecast',{}).get('state')=='missing':
              print('::error::De 14-daagse weersverwachting ontbreekt. Pagina is gepubliceerd met foutmelding.')
              sys.exit(1)
          if quality.get('fresh_count',0)==0:
              print('::error::Geen enkele modelbron is in deze run vernieuwd.')
              sys.exit(1)
          PY
